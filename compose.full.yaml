# Full mode: every dev service runs with its debugger on.
# Node apps run their `dev:debug` script; the Go app runs its debug command directly.
# Start with: docker compose -f compose.yaml -f compose.full.yaml up -d
# Back to lean: docker compose up -d

services:
  api_go:
    # -xdir tmp: see compose.yaml.
    command:
      [
        "sh",
        "-c",
        "go tool wgo -xdir tmp go build -gcflags='all=-N -l' -o ./tmp/server . :: go tool dlv exec ./tmp/server --headless --listen=:2345 --api-version=2 --accept-multiclient --continue",
      ]
    # Uncomment if Delve cannot start the server without it.
    # cap_add:
    #   - SYS_PTRACE

  api_ts:
    command:
      [
        "sh",
        "-c",
        "pnpm turbo --filter @iob-exploring-monorepo/api-ts-name-generator dev:debug",
      ]

  web:
    command:
      ["sh", "-c", "pnpm turbo --filter @iob-exploring-monorepo/web dev:debug"]
