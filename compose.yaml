name: exploring_monorepo

# The source of truth for every toolchain version. Exact versions only.
#
# These names are a contract: do not rename or remove one without changing every
# reader in the same commit. A new one is added here first, with its readers.
#   NODE_VERSION      all.Dockerfile, node.Dockerfile
#   OS_RELEASE        all.Dockerfile, go.Dockerfile, node.Dockerfile
#   PNPM_VERSION      all.Dockerfile, node.Dockerfile
#   GO_VERSION        all.Dockerfile, go.Dockerfile, scripts/update-go-version.sh (reads this file)
#   GOLANGCI_VERSION  all.Dockerfile
#   CACHE_DIR         all.Dockerfile, go.Dockerfile
x-versions-args: &versions-args
  NODE_VERSION: 24.21.0
  OS_RELEASE: trixie
  PNPM_VERSION: 12.14.0
  GO_VERSION: 1.27.2
  GOLANGCI_VERSION: 2.14.0
  CACHE_DIR: /monorepo/.cache

x-service-defaults: &service-defaults
  init: true
  environment:
    - NODE_ENV=development
  volumes:
    - ./:/monorepo
  depends_on:
    maintenance:
      condition: service_healthy

x-build-defaults: &build-defaults
  context: ./
  args:
    <<: *versions-args

services:
  # --- working services ---------------

  # Where the work is done: the editor attaches here, and git, the hooks, manual turbo
  # runs and the debuggers' clients all run here. Has every toolchain, runs nothing,
  # and waits for nothing, so it can be used even when `maintenance` fails.
  workspace:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./all.Dockerfile
      <<: *build-defaults
    depends_on: {}
    command: ["sleep", "infinity"]

  # Prepares what the other services need, then keeps it up to date:
  #   1. installs the dependencies and builds the Go tools
  #   2. generates code once (every package with a `generate` script)
  #   3. marks itself ready: the app services wait for this (see the healthcheck)
  #   4. stays alive, regenerating when a package with a `generate` script changes
  maintenance:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./all.Dockerfile
      <<: *build-defaults
    depends_on: {}
    environment:
      - NODE_ENV=development
      - CI=true
    # The marker is removed first: a container that is stopped and started keeps its
    # files, and must not look ready before the steps above have run again.
    command:
      [
        "sh",
        "-c",
        "rm -f /tmp/ready && pnpm install && go install tool && pnpm turbo run generate && touch /tmp/ready && exec pnpm turbo watch generate",
      ]
    # Healthy once the marker exists. Checked every second while starting, so the
    # app services start as soon as step 3 is reached.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      start_period: 5m
      start_interval: 1s
      interval: 30s
      timeout: 2s

  # --- app services --------------------

  # Every app service calls its program directly, with no wrapper process kept alive
  # (no shell, no `go tool`, no `pnpm run`). wgo comes from $GOPATH/bin, filled by
  # `maintenance` (`go install tool`); the Node programs from the app's node_modules/.bin.
  # -xdir tmp: the build writes into tmp/, inside the watched folder. Without the
  # exclusion the build would trigger the watcher and the server would start twice.
  #
  # KEEP IN STEP: each app's command here is also written as the `dev:lean` script in
  # the app's package.json (and its full-mode command, in compose.full.yaml, as
  # `dev:full`). Those scripts are for running the repo on the host without Docker
  # (`pnpm dev:lean` at the root). Whenever a command changes in one place, change it
  # in the other in the same commit. Two intended differences:
  #   - the scripts call Go tools through `go tool`: a host may not have $GOPATH/bin on PATH
  #   - in `dev:full`, the debuggers listen on 127.0.0.1 only, and the Node apps on a random
  #     port (`--inspect=0`): on one host, a fixed port would clash between the two Node apps,
  #     and 0.0.0.0 would open the debuggers to the local network
  api_go:
    <<: *service-defaults
    working_dir: /monorepo/apps/api-go-name-generator
    build:
      dockerfile: ./go.Dockerfile
      <<: *build-defaults
    ports:
      - "3006:3006"
    command:
      [
        "wgo",
        "-xdir",
        "tmp",
        "go",
        "build",
        "-o",
        "./tmp/server",
        ".",
        "::",
        "./tmp/server",
      ]

  api_ts:
    <<: *service-defaults
    working_dir: /monorepo/apps/api-ts-name-generator
    build:
      dockerfile: ./node.Dockerfile
      <<: *build-defaults
    ports:
      - "3001:3001"
    command: ["./node_modules/.bin/tsx", "watch", "src/index.ts"]

  web:
    <<: *service-defaults
    working_dir: /monorepo/apps/web
    build:
      dockerfile: ./node.Dockerfile
      <<: *build-defaults
    ports:
      - "5173:5173"
    command: ["./node_modules/.bin/vite", "dev"]
