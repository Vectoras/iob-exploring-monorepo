name: exploring_monorepo

x-versions-args: &versions-args
  NODE_VERSION: 24
  PNPM_VERSION: 11.25.0
  GO_VERSION: 1.27.1
  GOLANGCI_VERSION: 2.14.0
  CACHE_DIR: /monorepo/.cache

x-service-defaults: &service-defaults
  init: true
  build:
    context: ./
    dockerfile: ./Dockerfile
    args:
      <<: *versions-args
  environment:
    - NODE_ENV=development
  working_dir: /monorepo
  volumes:
    - ./:/monorepo
  depends_on:
    install:
      condition: service_completed_successfully

services:
  workspace:
    <<: *service-defaults
    depends_on: {}
    command: ["sleep", "infinity"]

  install:
    <<: *service-defaults
    depends_on: {}
    environment:
      - NODE_ENV=development
      - CI=true
    command: ["sh", "-c", "pnpm install && go install tool"]

  api_go:
    <<: *service-defaults
    ports:
      - "3006:3006"
    command:
      [
        "sh",
        "-c",
        "pnpm turbo --filter @iob-exploring-monorepo/api-go-name-generator dev:lean",
      ]

  api_ts:
    <<: *service-defaults
    ports:
      - "3001:3001"
    command:
      [
        "sh",
        "-c",
        "pnpm turbo --filter @iob-exploring-monorepo/api-ts-name-generator dev:lean",
      ]

  web:
    <<: *service-defaults
    ports:
      - "5173:5173"
    command:
      ["sh", "-c", "pnpm turbo --filter @iob-exploring-monorepo/web dev:lean"]
